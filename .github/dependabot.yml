version: 2
# Automated dependency alerts and update PRs (#341).
# Dependabot *security* updates (a PR as soon as an advisory is published) are
# switched on in repository settings → Code security; the groups below control
# how those PRs and the routine version updates are batched.
updates:
  # NPM dependency updates - daily
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '03:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    groups:
      # Security fixes grouped separately for priority handling
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      # Development dependencies
      dev-dependencies:
        applies-to: version-updates
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Production minor and patch updates
      prod-updates:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    # Rebase strategy to keep PRs clean
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automation'
      - 'chore'
      - 'devops'
    # Raise the range in package.json only when the new version falls outside it
    versioning-strategy: 'increase-if-necessary'
    pull-request-branch-name:
      separator: '/'

  # GitHub Actions updates - weekly schedule
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'UTC'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'ci/cd'
      - 'automation'
      - 'github-actions'
      - 'devops'
    pull-request-branch-name:
      separator: '/'
